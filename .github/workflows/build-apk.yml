name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FlowMic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowMic-apk
          path: FlowMic.apk

      - name: One-click release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FlowMic v1.0.${{ github.run_number }}
          body: |
            📲 **Installer en 1 clic : télécharge FlowMic.apk ci-dessous et ouvre-le sur ton Android.**

            Whisper Flow adapté mobile : bouton micro flottant, dicte dans n'importe quelle app.
          files: FlowMic.apk
